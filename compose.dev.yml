services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pennyworth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pennyworth_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pennyworth}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pennyworth} -d ${POSTGRES_DB:-pennyworth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: docker.io/library/node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run db:generate && npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pennyworth}:${POSTGRES_PASSWORD:-pennyworth_dev}@postgres:5432/${POSTGRES_DB:-pennyworth}?schema=public
      SESSION_SECRET: development-only-secret-change-me
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?INITIAL_ADMIN_PASSWORD is required for seeding}
      PRIMARY_CURRENCY: ${PRIMARY_CURRENCY:-EUR}
      APP_PORT: 3000
      APP_HOST: 0.0.0.0
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      UPDATE_CHECK_ENABLED: ${UPDATE_CHECK_ENABLED:-false}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-prerelease}
      UPDATE_CHECK_INTERVAL_HOURS: ${UPDATE_CHECK_INTERVAL_HOURS:-24}
    ports:
      - "3000:3000"
    volumes:
      - .:/app:Z
      - app-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  app-node-modules:

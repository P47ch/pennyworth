name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pennyworth
          POSTGRES_PASSWORD: pennyworth_dev
          POSTGRES_DB: pennyworth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pennyworth -d pennyworth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pennyworth:pennyworth_dev@localhost:5432/pennyworth_test?schema=public
      TEST_DATABASE_URL: postgresql://pennyworth:pennyworth_dev@localhost:5432/pennyworth_test?schema=public
      SESSION_SECRET: development-only-secret-change-me
      INITIAL_ADMIN_PASSWORD: ci-accessibility-password-2026
      AUDIT_PASSWORD: ci-accessibility-password-2026
      APP_PORT: 3000
      APP_HOST: 127.0.0.1
      APP_TIME_ZONE: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint LLM wiki
        run: npm run wiki:lint

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Seed audit user and sample data
        run: npm run db:seed

      - name: Run unit tests
        run: npm run test

      - name: Run integration tests
        run: npm run test:integration

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Chromium for accessibility audit
        run: npx playwright install --with-deps chromium

      - name: Run browser accessibility audit
        run: |
          npm run start > app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/login > /dev/null; then
              npm run audit:a11y
              exit $?
            fi
            sleep 1
          done
          cat app.log
          exit 1

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: app.log
